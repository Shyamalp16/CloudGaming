<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudGaming Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
    }

    .game-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #00ff88;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 2px 20px rgba(0, 255, 136, 0.3);
    }

    .game-title {
      font-size: 18px;
      font-weight: 600;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
      animation: pulse 2s infinite;
    }

    .status-indicator.connected {
      background: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 14px;
      color: #cccccc;
    }

    .game-container {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Immersive mode removes top header offset and chrome */
    body.immersive .game-container { top: 0; }
    body.immersive .game-header { display: none; }
    body.immersive .stream-viewport { border: none; box-shadow: none; }

    .stream-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      border: 2px solid #333;
      box-shadow: 
        inset 0 0 50px rgba(0, 255, 136, 0.1),
        0 0 50px rgba(0, 0, 0, 0.8);
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
      background: transparent;
      pointer-events: none;
      z-index: 5;
    }

    #input-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: none;
    }

    .game-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ff88;
      border-radius: 8px;
      color: #00ff88;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .control-btn:hover {
      background: rgba(0, 255, 136, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
      transform: scale(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid #333;
      border-top: 3px solid #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      color: #00ff88;
      text-align: center;
      margin-bottom: 10px;
    }

    .loading-subtext {
      font-size: 14px;
      color: #888;
      text-align: center;
    }

    .performance-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      color: #ccc;
      backdrop-filter: blur(10px);
      z-index: 20;
      min-width: 150px;
    }

    .perf-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .perf-value {
      color: #00ff88;
      font-weight: 600;
    }

    .debug-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 2px solid #333;
      padding: 15px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #ccc;
      backdrop-filter: blur(10px);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 500;
    }

    .debug-log.visible {
      transform: translateY(0);
    }

    .debug-log::-webkit-scrollbar {
      width: 8px;
    }

    .debug-log::-webkit-scrollbar-track {
      background: #111;
    }

    .debug-log::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .debug-log::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .log-entry {
      margin-bottom: 5px;
      padding: 2px 0;
      border-bottom: 1px solid #222;
    }

    .log-timestamp {
      color: #666;
      margin-right: 10px;
    }

    .log-level-info { color: #00ff88; }
    .log-level-warn { color: #ffaa00; }
    .log-level-error { color: #ff4444; }

    /* Video is hidden by default; bg-video class activates direct hardware rendering */
    #hiddenVideo { display: none; pointer-events: none; }
    #hiddenVideo.bg-video {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
      pointer-events: none;
    }

    .fullscreen-mode {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2000;
      background: #000;
    }

    .fullscreen-mode .game-header {
      display: none;
    }

    .fullscreen-mode .debug-log {
      display: none;
    }

    :fullscreen {
        background: #000 !important;
    }

    :fullscreen .game-header {
        display: none !important;
    }

    :fullscreen .debug-log {
        display: none !important;
    }

    :fullscreen .stream-viewport {
        border: none !important;
        box-shadow: none !important;
    }

    @media (max-width: 768px) {
      .game-header {
        height: 40px;
        padding: 0 15px;
      }
      
      .game-title {
        font-size: 16px;
      }
      
      .game-container {
        top: 40px;
      }
      
      .performance-overlay {
        font-size: 11px;
        padding: 8px;
      }
      
      .control-btn {
        width: 35px;
        height: 35px;
        font-size: 14px;
      }
    }

    .gaming-cursor {
      cursor: crosshair !important;
    }

    .quality-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .quality-bar {
      width: 3px;
      height: 12px;
      background: #333;
      border-radius: 1px;
    }

    .quality-bar.active { background: #00ff88; }
    .quality-bar.medium { background: #ffaa00; }
    .quality-bar.poor { background: #ff4444; }

    #roomSetup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 30px 40px;
      border-radius: 12px;
      border: 1px solid #00ff88;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
      z-index: 200;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    #roomSetup h2 {
      margin-bottom: 20px;
      color: #00ff88;
    }

    #roomIdInput {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #111;
      color: #eee;
      margin-bottom: 20px;
      text-align: center;
    }

    #joinButton {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #00ff88;
      color: #111;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #joinButton:hover {
      background: #fff;
      box-shadow: 0 0 15px #00ff88;
    }

    #findMatchButton {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 15px;
      width: 100%;
    }

    #findMatchButton:hover {
      background: linear-gradient(135deg, #ff8555 0%, #ffa33e 100%);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
      transform: translateY(-2px);
    }

    #findMatchButton:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .match-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #666;
      font-size: 14px;
    }

    .match-divider::before,
    .match-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #444;
    }

    .match-divider span {
      padding: 0 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .match-status {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
      min-height: 20px;
    }

    .match-status.error {
      color: #ff4444;
    }

    .match-status.success {
      color: #00ff88;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="roomSetup">
    <h2>Cloud Gaming</h2>
    <button id="findMatchButton">Find Match</button>
    <div id="matchStatus" class="match-status"></div>
    <div class="match-divider"><span>or join manually</span></div>
    <input type="text" id="roomIdInput" placeholder="Paste Room ID from Host...">
    <button id="joinButton">Join Session</button>
  </div>

  <div class="game-header hidden" id="gameHeader">
    <div class="game-title">🎮 CloudGaming Client</div>
    <div class="connection-status">
      <div class="quality-indicator">
        <div class="quality-bar" id="q1"></div>
        <div class="quality-bar" id="q2"></div>
        <div class="quality-bar" id="q3"></div>
        <div class="quality-bar" id="q4"></div>
      </div>
      <div class="status-indicator" id="connectionStatus"></div>
      <div class="status-text" id="statusText">Connecting...</div>
    </div>
  </div>

  <div class="game-container hidden" id="gameContainer">
    <div class="stream-viewport" id="streamViewport">
      <div class="performance-overlay" id="perfOverlay">
        <div class="perf-item">
          <span>Latency:</span>
          <span class="perf-value" id="latencyValue">-- ms</span>
        </div>
        <div class="perf-item">
          <span>FPS:</span>
          <span class="perf-value" id="fpsValue">-- fps</span>
        </div>
        <div class="perf-item">
          <span>Quality:</span>
          <span class="perf-value" id="qualityValue">--</span>
        </div>
        <div class="perf-item">
          <span>Bitrate:</span>
          <span class="perf-value" id="bitrateValue">-- kbps</span>
        </div>
      </div>

      <div class="game-controls">
        <button class="control-btn" id="debugBtn" onclick="toggleDebug()" title="Toggle Debug">🐛</button>
        <button class="control-btn" id="audioBtn" onclick="checkAudioStatus()" title="Check Audio Status">🔊</button>
        <button class="control-btn" id="perfBtn" onclick="togglePerf()" title="Toggle Performance">📊</button>
        <button class="control-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
      </div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">Connecting to Game Server</div>
        <div class="loading-subtext" id="loadingSubtext">Establishing WebRTC connection...</div>
      </div>

      <video id="hiddenVideo" autoplay playsinline muted></video>
      <canvas id="gameCanvas"></canvas>
      <div id="input-overlay"></div>
    </div>
  </div>

  <div class="debug-log" id="debugLog"></div>

  <script>
    document.getElementById('joinButton').addEventListener('click', async () => {
      try {
        await networkConfigReady;
      } catch (error) {
        alert(`Network configuration failed: ${error.message}`);
        return;
      }
      const roomId = document.getElementById('roomIdInput').value;
        if (!roomId) {
            alert('Please enter a Room ID.');
            return;
        }

        // Create and arm audio element under user gesture (non-blocking)
        const audioEl = createHiddenAudioElement();
        try {
          const p = audioEl.play();
          if (p && typeof p.then === 'function') {
            p.then(() => log('Primed dedicated audio element on user gesture'))
             .catch(e => log(`Audio priming failed (will retry when track arrives): ${e}`, 'warn'));
          }
        } catch (e) {
          log(`Audio priming threw (will retry when track arrives): ${e}`, 'warn');
        }

        document.getElementById('roomSetup').classList.add('hidden');
        // Immersive mode: hide header, remove 50px offset so video fills top
        document.body.classList.add('immersive');
        document.getElementById('gameContainer').classList.remove('hidden');

        currentIceServers = defaultIceServers;
        connectToSignalingServer(roomId);
    });

    // Find Match button handler - queries matchmaker for an available host
    document.getElementById('findMatchButton').addEventListener('click', async () => {
        const findMatchBtn = document.getElementById('findMatchButton');
        const matchStatus = document.getElementById('matchStatus');
        
        // Disable button while searching
        findMatchBtn.disabled = true;
        findMatchBtn.textContent = 'Searching...';
        matchStatus.textContent = 'Looking for available hosts...';
        matchStatus.className = 'match-status';
        
        try {
            await networkConfigReady;
            const response = await fetch(`${matchmakerUrl}/api/match/find`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({}),
                mode: 'cors'
            });
            if (!response.ok) {
                throw new Error(`Matchmaker returned HTTP ${response.status}`);
            }
            const data = await response.json();
            
            if (data.found) {
                matchStatus.textContent = `Found host! Connecting to room ${data.roomId}...`;
                matchStatus.className = 'match-status success';
                
                // Create and arm audio element under user gesture
                const audioEl = createHiddenAudioElement();
                try {
                    const p = audioEl.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => log('Primed dedicated audio element on user gesture'))
                         .catch(e => log(`Audio priming failed: ${e}`, 'warn'));
                    }
                } catch (e) {
                    log(`Audio priming threw: ${e}`, 'warn');
                }
                
                document.getElementById('roomSetup').classList.add('hidden');
                document.body.classList.add('immersive');
                document.getElementById('gameContainer').classList.remove('hidden');
                
                if (Array.isArray(data.iceServers) && data.iceServers.length > 0) {
                    currentIceServers = data.iceServers;
                    log(`Using ${data.iceServers.length} ICE server entries from matchmaker`);
                } else {
                    currentIceServers = defaultIceServers;
                    log('Matchmaker returned no ICE servers; falling back to default STUN', 'warn');
                }

                // The shared network profile is authoritative. In LAN mode the
                // matchmaker runs on the host machine but cannot infer which LAN
                // address the browser used to reach it.
                connectToSignalingServer(data.roomId, serverUrlBase);
            } else {
                matchStatus.textContent = data.message || 'No hosts available. Try again later.';
                matchStatus.className = 'match-status error';
                findMatchBtn.disabled = false;
                findMatchBtn.textContent = 'Find Match';
            }
        } catch (error) {
            console.error('Matchmaker error:', error);
            matchStatus.textContent = `Connection failed: ${error.message}`;
            matchStatus.className = 'match-status error';
            findMatchBtn.disabled = false;
            findMatchBtn.textContent = 'Find Match';
        }
    });

    // ─── Shared network profile ─────────────────────────────────────────────────
    // Change only `mode` in network-config.json:
    //   local      browser and host are this machine
    //   lan        browser uses the hostname/IP from this page's URL
    //   production use the public HTTPS/WSS endpoints in that file
    let networkMode = '';
    let matchmakerUrl = '';
    let serverUrlBase = '';

    function urlHost(hostname) {
      return hostname.includes(':') ? `[${hostname}]` : hostname;
    }

    const networkConfigReady = fetch('./network-config.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) {
          throw new Error(`network-config.json returned HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(config => {
        networkMode = config.mode;
        if (networkMode === 'local' || networkMode === 'lan') {
          const signalingPort = Number(config.ports?.signaling ?? 3002);
          const matchmakerPort = Number(config.ports?.matchmaker ?? 3000);
          if (!Number.isInteger(signalingPort) || signalingPort < 1 || signalingPort > 65535 ||
              !Number.isInteger(matchmakerPort) || matchmakerPort < 1 || matchmakerPort > 65535) {
            throw new Error('Local service ports must be integers between 1 and 65535');
          }
          const endpointHost = networkMode === 'local' ? '127.0.0.1' : location.hostname;
          if (!endpointHost) {
            throw new Error('LAN mode requires serving this page over HTTP, not opening it as a file');
          }
          const host = urlHost(endpointHost);
          matchmakerUrl = `http://${host}:${matchmakerPort}`;
          serverUrlBase = `ws://${host}:${signalingPort}`;
        } else if (networkMode === 'production') {
          matchmakerUrl = config.production?.matchmakerUrl ?? '';
          serverUrlBase = config.production?.signalingUrl ?? '';
          if (!matchmakerUrl.startsWith('https://') || !serverUrlBase.startsWith('wss://')) {
            throw new Error('Production endpoints must use https:// and wss://');
          }
        } else {
          throw new Error(`Invalid mode '${networkMode}' (expected local, lan, or production)`);
        }

        log(`Network mode: ${networkMode}; signaling: ${serverUrlBase}; matchmaker: ${matchmakerUrl}`);
      })
      .catch(error => {
        console.error('Failed to load network configuration:', error);
        document.getElementById('joinButton').disabled = true;
        document.getElementById('findMatchButton').disabled = true;
        throw error;
      });
    // ────────────────────────────────────────────────────────────────────────────
    let ws;
    let peerConnection;
    const hiddenVideoElement = document.getElementById('hiddenVideo');
    const canvas = document.getElementById('gameCanvas');
    const debugLog = document.getElementById('debugLog');
    const streamViewport = document.getElementById('streamViewport');

    // Create a hidden audio element as fallback for audio-only scenarios
    let hiddenAudioElement = null;
    function createHiddenAudioElement() {
      if (!hiddenAudioElement) {
        hiddenAudioElement = document.createElement('audio');
        hiddenAudioElement.style.display = 'none';
        hiddenAudioElement.autoplay = true;
        hiddenAudioElement.muted = false;
        hiddenAudioElement.volume = 1.0;
        document.body.appendChild(hiddenAudioElement);
        log('Created hidden audio element for fallback audio playback');
      }
      return hiddenAudioElement;
    }
    let dataChannel;
    let mouseChannel;
    let animationId;
    let renderGeneration = 0;
    let isFullscreen = false;
    let debugVisible = false;
    let perfVisible = true;
    let currentRoomId = null;
    let signalingGeneration = 0;
    let reconnectAttempt = 0;
    let reconnectTimer = null;
    const pendingRemoteIceCandidates = [];
    const defaultIceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
    let currentIceServers = defaultIceServers;
    
    const keyState = new Set();
    const pendingKeyEvents = new Map();
    const KEY_CHANNEL_HIGH_WATER = 16384;
    let keySequenceId = 0;
    const mouseButtonState = new Set();
    const mousePosition = {x: 0, y: 0};
    const pendingMouseButtons = new Map();
    let pendingMouseWheel = null;
    let pendingMouseMove = null;
    const MOUSE_CHANNEL_HIGH_WATER = 16384;

    let frameCount = 0;
    let lastFallbackDecodedFrames = 0;
    let lastFrameTime = Date.now();
    let fps = 0;
    let latency = 0;
    let netFps = 0;
    let bitrateKbps = 0;
    let activeStatsTimer = null;

    // Rendering control
    let renderActive = false;
    const useVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;

    canvas.width = 1920;
    canvas.height = 1080;

    // Debug: log video element state (readyState, size, currentTime)
    function logVideoState(label) {
      const r = hiddenVideoElement.readyState;
      const w = hiddenVideoElement.videoWidth;
      const h = hiddenVideoElement.videoHeight;
      const t = hiddenVideoElement.currentTime;
      log(`[VIDEO] ${label} readyState=${r} size=${w}x${h} currentTime=${t.toFixed(3)}`);
    }
    hiddenVideoElement.addEventListener('loadedmetadata', () => logVideoState('loadedmetadata'));
    hiddenVideoElement.addEventListener('canplay', () => logVideoState('canplay'));
    hiddenVideoElement.addEventListener('playing', () => logVideoState('playing'));
    hiddenVideoElement.addEventListener('resize', () => logVideoState('resize'));

    // Expose a helper to show the raw <video> for debugging from DevTools
    window.toggleRawVideo = () => {
      const v = hiddenVideoElement;
      if (v.style.display === 'none' || !v.style.display) {
        v.style.display = 'block';
        v.style.position = 'absolute';
        v.style.left = '10px';
        v.style.top = '60px';
        v.style.zIndex = '2001';
        v.style.width = '640px';
        v.style.height = '360px';
        log('[VIDEO] Raw video element made visible');
      } else {
        v.style.display = 'none';
        log('[VIDEO] Raw video element hidden');
      }
      logVideoState('toggleRawVideo');
    };

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            document.getElementById('fullscreenBtn').textContent = '🗗';
            isFullscreen = true;
            updateConnectionStatus('connected', 'Fullscreen Mode');
        } else {
            await document.exitFullscreen();
            document.getElementById('fullscreenBtn').textContent = '⛶';
            isFullscreen = false;
            updateConnectionStatus('connected', 'Connected');
        }
      } catch (err) {
        console.error('Fullscreen error:', err);
        if (!isFullscreen) {
            streamViewport.classList.add('fullscreen-mode');
            document.getElementById('fullscreenBtn').textContent = '🗗';
            isFullscreen = true;
        } else {
            streamViewport.classList.remove('fullscreen-mode');
            document.getElementById('fullscreenBtn').textContent = '⛶';
            isFullscreen = false;
        }
      }
    }

    function toggleDebug() {
      debugVisible = !debugVisible;
      debugLog.classList.toggle('visible', debugVisible);
      document.getElementById('debugBtn').style.background = debugVisible ? 
        'rgba(0, 255, 136, 0.3)' : 'rgba(0, 0, 0, 0.8)';
    }

    function togglePerf() {
      perfVisible = !perfVisible;
      document.getElementById('perfOverlay').style.display = perfVisible ? 'block' : 'none';
      document.getElementById('perfBtn').style.background = perfVisible ?
        'rgba(0, 255, 136, 0.3)' : 'rgba(0, 0, 0, 0.8)';
    }

    function checkAudioStatus() {
      const video = document.getElementById('hiddenVideo');
      const audio = hiddenAudioElement;
      log('=== AUDIO STATUS CHECK ===');

      // Check video element
      if (video.srcObject) {
        const audioTracks = video.srcObject.getAudioTracks();
        log(`Video element audio tracks: ${audioTracks.length}`);
        audioTracks.forEach((track, index) => {
          log(`Video Track ${index}: enabled=${track.enabled}, muted=${track.muted}, readyState=${track.readyState}`);
        });
      } else {
        log('No media stream attached to video element');
      }

      // Check dedicated audio element
      if (audio && audio.srcObject) {
        const audioTracks = audio.srcObject.getAudioTracks();
        log(`Dedicated audio element tracks: ${audioTracks.length}`);
        audioTracks.forEach((track, index) => {
          log(`Audio Track ${index}: enabled=${track.enabled}, muted=${track.muted}, readyState=${track.readyState}`);
        });
        log(`Audio element - paused: ${audio.paused}, ended: ${audio.ended}, readyState: ${audio.readyState}`);
      } else {
        log('No dedicated audio element or no stream attached');
      }

      log(`Video element - muted: ${video.muted}, volume: ${video.volume}, paused: ${video.paused}`);
      log(`Video element - readyState: ${video.readyState}, networkState: ${video.networkState}`);

      // Try to force audio playback on both elements
      const playPromises = [];

      if (video.srcObject && video.paused) {
        playPromises.push(
          video.play().then(() => {
            log('Forced video element playback');
          }).catch(e => {
            log(`Failed to force video playback: ${e}`, 'error');
          })
        );
      }

      if (audio && audio.srcObject && audio.paused) {
        playPromises.push(
          audio.play().then(() => {
            log('Forced dedicated audio playback');
          }).catch(e => {
            log(`Failed to force audio playback: ${e}`, 'error');
          })
        );
      }

      if (playPromises.length === 0) {
        log('Both elements already playing or no streams attached');
      }

      log('========================');
    }

    function updateConnectionStatus(status, text) {
      const indicator = document.getElementById('connectionStatus');
      const statusText = document.getElementById('statusText');
      
      indicator.className = `status-indicator ${status}`;
      statusText.textContent = text;
    }

    function updateQualityIndicator(quality) {
      const bars = ['q1', 'q2', 'q3', 'q4'];
      bars.forEach((id, index) => {
        const bar = document.getElementById(id);
        bar.className = 'quality-bar';
        if (index < quality) {
          if (quality >= 3) bar.classList.add('active');
          else if (quality >= 2) bar.classList.add('medium');
          else bar.classList.add('poor');
        }
      });
    }

    function updatePerformanceDisplay() {
      document.getElementById('fpsValue').textContent = `${fps} fps`;
      document.getElementById('latencyValue').textContent = `${latency} ms`;
      document.getElementById('bitrateValue').textContent = `${bitrateKbps} kbps`;
      // Quality based on decoded fps from network (netFps)
      const q = netFps > 50 ? 'Excellent' : netFps > 30 ? 'Good' : 'Poor';
      document.getElementById('qualityValue').textContent = q;
      const qualityLevel = netFps > 50 ? 4 : netFps > 30 ? 3 : netFps > 15 ? 2 : 1;
      updateQualityIndicator(qualityLevel);
    }

    function hideLoadingOverlay() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function showLoadingOverlay(text, subtext) {
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.remove('hidden');
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingSubtext').textContent = subtext;
    }

    function renderVideoToCanvas() {
      if (!renderActive) return;
      // Video is rendered directly by the browser (bg-video class).
      const currentTime = Date.now();
      if (currentTime - lastFrameTime >= 1000) {
        const quality = hiddenVideoElement.getVideoPlaybackQuality?.();
        if (quality) {
          const decodedDelta = quality.totalVideoFrames - lastFallbackDecodedFrames;
          fps = Math.round((decodedDelta * 1000) / (currentTime - lastFrameTime));
          lastFallbackDecodedFrames = quality.totalVideoFrames;
        }
        frameCount = 0;
        lastFrameTime = currentTime;
        updatePerformanceDisplay();
      }
      animationId = requestAnimationFrame(renderVideoToCanvas);
    }

    function scheduleVideoFrameCallback(generation) {
      if (!renderActive || !('requestVideoFrameCallback' in hiddenVideoElement)) return;
      // Video is rendered directly by the browser (bg-video class).
      // rVFC fires each time the browser produces a new decoded frame — use it only to count FPS.
      hiddenVideoElement.requestVideoFrameCallback(() => {
        if (!renderActive || generation !== renderGeneration) return;
        frameCount++;
        const currentTime = Date.now();
        if (currentTime - lastFrameTime >= 1000) {
          fps = Math.round((frameCount * 1000) / (currentTime - lastFrameTime));
          frameCount = 0;
          lastFrameTime = currentTime;
          updatePerformanceDisplay();
        }
        scheduleVideoFrameCallback(generation);
      });
    }

    function startRenderingLoop() {
      renderActive = true;
      const generation = ++renderGeneration;
      lastFrameTime = Date.now();
      lastFallbackDecodedFrames = hiddenVideoElement.getVideoPlaybackQuality?.().totalVideoFrames || 0;
      if (useVFC) {
        scheduleVideoFrameCallback(generation);
      } else {
        animationId = requestAnimationFrame(renderVideoToCanvas);
      }
    }

    function stopRenderingLoop() {
      renderActive = false;
      renderGeneration++;
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      if (activeStatsTimer) {
        clearInterval(activeStatsTimer);
        activeStatsTimer = null;
      }
      hiddenVideoElement.classList.remove('bg-video');
    }

    function log(message, level = 'info') {
      let text;
      try {
        text = typeof message === 'string' ? message : JSON.stringify(message);
      } catch (_) {
        text = String(message);
      }
      if (typeof text !== 'string') text = String(message);
      console.log(text);
      
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry';
      const timestampNode = document.createElement('span');
      timestampNode.className = 'log-timestamp';
      timestampNode.textContent = `[${timestamp}] `;
      const messageNode = document.createElement('span');
      messageNode.className = `log-level-${level}`;
      messageNode.textContent = text;
      logEntry.append(timestampNode, messageNode);
      
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      
      if (debugLog.children.length > 200) {
        debugLog.removeChild(debugLog.firstChild);
      }

      if (text.includes('Connected to signaling server')) {
        showLoadingOverlay('Connected to Server', 'Initializing WebRTC connection...');
      } else if (text.includes('Video started playing')) {
        hideLoadingOverlay();
        updateConnectionStatus('connected', 'Connected');
      }
    }

    function throttle(func, wait) {
      let inThrottle, lastFn, lastTime;
      return function() {
        const context = this;
        const args = arguments;
        if (!inThrottle) {
          func.apply(context, args);
          lastTime = Date.now();
          inThrottle = true;
        } else {
          clearTimeout(lastFn);
          lastFn = setTimeout(function() {
            if (Date.now() - lastTime >= wait) {
              func.apply(context, args);
              lastTime = Date.now();
            }
          }, Math.max(wait - (Date.now() - lastTime), 0));
        }
      };
    }

    const throttledSendMouseMove = throttle((event) => {
      const position = getRemotePointerPosition(event);
      const mouseData = {
        type: "mousemove",
        x: position.x,
        y: position.y,
        client_send_time: Date.now(),
      };

      sendMouseEvent(mouseData);
      mousePosition.x = mouseData.x;
      mousePosition.y = mouseData.y;
    }, 8);

    function connectToSignalingServer(roomId, signalingUrl = serverUrlBase) {
      currentRoomId = roomId;
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
        ws.onclose = null;
        ws.close(1000, 'Replaced by a new signaling connection');
      }
      const generation = ++signalingGeneration;
      const serverUrl = `${signalingUrl}?roomId=${encodeURIComponent(roomId)}`;
      log(`Attempting to connect to WebSocket server at ${serverUrl}...`);
      updateConnectionStatus('connecting', 'Connecting...');
      try {
        ws = new WebSocket(serverUrl);
      } catch (error) {
        log(`WebSocket creation failed: ${error.message}`, 'error');
        showLoadingOverlay('Connection Failed', 'Could not connect to the signaling server.');
        updateConnectionStatus('disconnected', 'Error');
        return;
      }
      const socket = ws;

      socket.onopen = () => {
        if (generation !== signalingGeneration || socket !== ws) return;
        log('Connected to signaling server');
        updateConnectionStatus('connected', 'Server Connected');
        startConnection();
      };

      // Browser WebSocket automatically handles ping/pong at protocol level
      // No need for manual ping handling

      socket.onmessage = async (event) => {
        if (generation !== signalingGeneration || socket !== ws) return;
        try {
          const msg = JSON.parse(event.data);
          if (msg.sdp && msg.sdp.length > 100) {
            log(`Received from server: { type: ${msg.type}, sdp: '...', candidate: ${JSON.stringify(msg.candidate)} }`);
          } else {
            log('Received from server: ' + JSON.stringify(msg, null, 2));
          }

          switch (msg.type) {
            case 'peer-disconnected':
              log('Peer has disconnected. Closing connection.', 'warn');
              updateConnectionStatus('disconnected', 'Peer Left');
              socket.close();
              break;
            case 'answer':
              await handleAnswer(msg);
              break;
            case 'candidate': {
              // New schema from server: candidate is a string at top-level
              if (typeof msg.candidate === 'string') {
                const ice = { candidate: msg.candidate, sdpMid: msg.sdpMid, sdpMLineIndex: msg.sdpMLineIndex };
                await handleRemoteIceCandidate(ice);
              } else if (msg.candidate === null) {
                log("Received null ICE candidate (end of candidates).");
              } else {
                log("Received invalid ICE candidate structure.");
              }
              break;
            }
            case 'ice-candidate':
              if (msg.candidate && msg.candidate.candidate) {
                await handleRemoteIceCandidate(msg.candidate);
              } else if (msg.candidate === null) {
                log("Received null ICE candidate (end of candidates).");
              } else {
                log("Received invalid ICE candidate structure.");
              }
              break;
            case 'offer':
              log('Unexpected Offer Received.');
              break;
            case 'control':
              // Server sends schema errors or other control messages
              if (msg.action === 'schema-error') {
                log('Server reported schema-error for last message. Check signaling payload shapes.', 'warn');
              } else {
                log('Control message: ' + JSON.stringify(msg));
              }
              break;
            default:
              log('Unknown Message Type: ' + msg.type);
          }
        } catch (err) {
          log(`Error processing WebSocket message: ${err.message}. Data: ${event.data}`, 'error');
        }
      };

      socket.onerror = (event) => {
        if (generation !== signalingGeneration || socket !== ws) return;
        log('WebSocket Error occurred. Check browser console.', 'error');
        updateConnectionStatus('disconnected', 'Connection Error');
        console.error("WebSocket Error Event:", event);
      };

      socket.onclose = (event) => {
        if (generation !== signalingGeneration || socket !== ws) return;
        log(`WebSocket connection closed. Code: ${event.code}, Reason: ${event.reason || 'N/A'}`, 'warn');
        updateConnectionStatus('disconnected', 'Disconnected');
        stopRenderingLoop();
        // Reset stats on disconnect
        fps = 0; netFps = 0; bitrateKbps = 0;
        updatePerformanceDisplay();
        releaseAllPressedInput('signaling_closed');
        peerConnection?.close();
        peerConnection = null;
        dataChannel = null;
        mouseChannel = null;
        hiddenVideoElement.srcObject = null;
        if (hiddenAudioElement) hiddenAudioElement.srcObject = null;
        pendingRemoteIceCandidates.length = 0;
        showLoadingOverlay('Connection Lost', 'Attempting to reconnect...');

        // Exponential backoff reconnect
        const maxDelay = 15000; // 15s
        reconnectAttempt++;
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempt - 1), maxDelay);
        log(`Reconnecting in ${Math.round(delay/1000)}s...`);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          if (generation !== signalingGeneration || socket !== ws) return;
          connectToSignalingServer(currentRoomId, signalingUrl);
        }, delay);
      };
    }

    function createPeerConnection() {
      if (peerConnection) {
        log("PeerConnection already exists, not creating again.");
        return;
      }
      log("Creating new PeerConnection...");
      showLoadingOverlay('Establishing Connection', 'Setting up peer connection...');
      
      const config = {
        iceServers: currentIceServers,
      };
      try {
        peerConnection = new RTCPeerConnection(config);
      } catch (error) {
        log(`RTCPeerConnection creation failed: ${error.message}`, 'error');
        showLoadingOverlay('Connection Failed', 'WebRTC setup failed.');
        updateConnectionStatus('disconnected', 'Error');
        return;
      }
      const pc = peerConnection;

      pc.ontrack = (event) => {
        if (peerConnection !== pc) return;
        log(`Received remote track: Kind=${event.track.kind}, ID=${event.track.id}`);
        if (event.track.kind === 'video') {
          const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
          if (hiddenVideoElement.srcObject !== stream) {
            log(`Attaching stream ${stream.id} to hidden video element.`);
            hiddenVideoElement.srcObject = stream;

            const receiver = event.receiver;
            if (receiver) {
              if (receiver.playoutDelayHint !== undefined) {
                receiver.playoutDelayHint = 0;
                log('Set playoutDelayHint = 0 for minimum jitter buffer');
              }
              if (receiver.jitterBufferTarget !== undefined) {
                receiver.jitterBufferTarget = 0;
                log('Set jitterBufferTarget = 0 for minimum jitter buffer');
              }
              try {
                if (receiver.setDegradationPreference) {
                  receiver.setDegradationPreference('maintain-framerate');
                  log('Set degradationPreference to maintain-framerate');
                }
              } catch (e) { /* ignore if unsupported */ }
            }

            hiddenVideoElement.play().then(() => {
              if (peerConnection !== pc) return;
              logVideoState('after play() resolved');
              log('Video started playing, activating direct hardware video rendering...');
              // Bypass the canvas/Skia path: show the video element directly so the
              // browser compositor uses its hardware BT.709 color pipeline.
              hiddenVideoElement.classList.add('bg-video');
              startRenderingLoop();
              hideLoadingOverlay();
              updateConnectionStatus('connected', 'Streaming');
            }).catch(e => {
              log(`Video play() failed: ${e}. User interaction might be required.`, 'error');
            });

            // Canvas no longer used as a draw surface — video renders directly.
            // No canvas resize needed.
            hiddenVideoElement.onresize = () => {
              if (hiddenVideoElement.videoWidth > 0 && hiddenVideoElement.videoHeight > 0) {
                canvas.width = hiddenVideoElement.videoWidth;
                canvas.height = hiddenVideoElement.videoHeight;
              }
              logVideoState('onresize');
            };

            // Clear any previous stats timer before creating a new one
            if (activeStatsTimer) {
              clearInterval(activeStatsTimer);
              activeStatsTimer = null;
            }
            let lastFramesDecoded = 0;
            let lastBytes = 0;
            let lastStatsTime = performance.now();
            const statsTimer = setInterval(async () => {
              if (peerConnection !== pc) {
                clearInterval(statsTimer);
                if (activeStatsTimer === statsTimer) activeStatsTimer = null;
                return;
              }
              try {
                const stats = await pc.getStats();
                if (peerConnection !== pc) return;
                let inbound = null;
                let currentRttSeconds = null;
                stats.forEach(report => {
                  if (report.type === 'inbound-rtp' && report.kind === 'video') inbound = report;
                  if (report.type === 'candidate-pair' && report.state === 'succeeded' &&
                      (report.nominated || report.selected) && Number.isFinite(report.currentRoundTripTime)) {
                    currentRttSeconds = report.currentRoundTripTime;
                  } else if (currentRttSeconds === null && report.type === 'remote-inbound-rtp' &&
                             Number.isFinite(report.roundTripTime)) {
                    currentRttSeconds = report.roundTripTime;
                  }
                });
                if (!inbound) return;
                const now = performance.now();
                const dt = Math.max(1, now - lastStatsTime);
                const frames = inbound.framesDecoded || 0;
                const bytes = inbound.bytesReceived || 0;
                netFps = Math.round(((frames - lastFramesDecoded) * 1000) / dt);
                bitrateKbps = Math.round(((bytes - lastBytes) * 8) / dt);
                if (currentRttSeconds !== null) latency = (currentRttSeconds * 1000).toFixed(1);
                lastFramesDecoded = frames;
                lastBytes = bytes;
                lastStatsTime = now;
                updatePerformanceDisplay();
              } catch (e) {}
            }, 1000);
            activeStatsTimer = statsTimer;
          }
        } else if (event.track.kind === 'audio') {
          log('Received audio track, setting up dedicated audio playback');

          // Ensure audio track is enabled
          event.track.enabled = true;
          log(`Audio track enabled: ${event.track.enabled}, muted: ${event.track.muted}, readyState: ${event.track.readyState}`);

          const receiver = event.receiver;
          if (receiver) {
            if (receiver.playoutDelayHint !== undefined) {
              receiver.playoutDelayHint = 0;
              log('Set audio playoutDelayHint = 0');
            }
            if (receiver.jitterBufferTarget !== undefined) {
              // Keep a tiny target to avoid massive audio buildup while still smoothing burst jitter.
              receiver.jitterBufferTarget = 10;
              log('Set audio jitterBufferTarget = 10ms');
            }
          }

          // Use ONLY a dedicated audio element
          const audioElement = createHiddenAudioElement();
          const audioStream = new MediaStream([event.track]);
          audioElement.srcObject = audioStream;
          audioElement.muted = false;
          audioElement.volume = 1.0;

          // Route to default output device when supported
          try {
            if (typeof audioElement.setSinkId === 'function') {
              audioElement.setSinkId('default')
                .then(() => log('Audio sink set to default device'))
                .catch(e => log(`setSinkId failed: ${e}`, 'warn'));
            }
          } catch (e) { /* ignore */ }

          // Add playback state hooks
          audioElement.onplaying = () => log('Audio element onplaying');
          audioElement.onpause = () => log('Audio element onpause');
          audioElement.onvolumechange = () => log(`Audio volume change: ${audioElement.volume}`);
          audioElement.onerror = (e) => log(`Audio element error: ${audioElement.error?.message || e.type}`, 'error');


          // Start or resume playback (should be already primed by Join click)
          try {
            const p = audioElement.play();
            if (p && typeof p.then === 'function') {
              p.then(() => {
                log('Audio playback confirmed after track attach');
                updateConnectionStatus('connected', 'Audio Streaming');
              }).catch(e => {
                log(`Audio play() after track attach failed: ${e}`, 'warn');
              });
            }
          } catch (e) {
            log(`Audio play() threw after attach: ${e}`, 'warn');
          }
        }
      };

      pc.onicecandidate = (event) => {
        if (peerConnection !== pc) return;
        if (event.candidate) {
          log(`Generated local ICE candidate (type: ${event.candidate.type || 'unknown'}). Sending...`);
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'candidate',
              candidate: event.candidate.candidate,
              sdpMid: event.candidate.sdpMid,
              sdpMLineIndex: event.candidate.sdpMLineIndex
            }));
          } else {
            log("WebSocket not open, cannot send ICE candidate.", 'warn');
          }
        } else {
          log('Local ICE candidate gathering complete.');
        }
      };

      pc.oniceconnectionstatechange = () => {
        if (peerConnection !== pc) return;
        log('ICE connection state changed to: ' + pc.iceConnectionState);
        if (pc.iceConnectionState === 'connected') {
          updateConnectionStatus('connected', 'ICE Connected');
        } else if (pc.iceConnectionState === 'disconnected') {
          updateConnectionStatus('disconnected', 'ICE Disconnected');
        } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
          stopRenderingLoop();
          fps = 0; netFps = 0; bitrateKbps = 0; updatePerformanceDisplay();
        }
      };
      
      pc.onicegatheringstatechange = () => {
        if (peerConnection !== pc) return;
        log('ICE gathering state changed to: ' + pc.iceGatheringState);
      };
      pc.onconnectionstatechange = () => {
        if (peerConnection !== pc) return;
        log('PeerConnection state changed to: ' + pc.connectionState);
        if (['failed','closed'].includes(pc.connectionState)) {
          stopRenderingLoop();
          fps = 0; netFps = 0; bitrateKbps = 0; updatePerformanceDisplay();
        }
      };
      pc.onsignalingstatechange = () => {
        if (peerConnection !== pc) return;
        log('Signaling state changed to: ' + pc.signalingState);
      };

      dataChannel = pc.createDataChannel("keyPressChannel", { ordered: true });
      // Movement is disposable and must never head-of-line block controls.
      // Buttons and wheel events travel on the reliable ordered key channel.
      mouseChannel = pc.createDataChannel("mouseChannel", { ordered: false, maxRetransmits: 0 });
      log(`Client attempting to create data channel "${dataChannel.label}", initial state: ${dataChannel.readyState}`);
      log(`Client attempting to create data channel "${mouseChannel.label}", initial state: ${mouseChannel.readyState}`);

      

      dataChannel.onopen = () => {
        log(`Data Channel Opened: "${dataChannel.label}", ReadyState: ${dataChannel.readyState}`);
        dataChannel.bufferedAmountLowThreshold = 4096;
        // Re-establish keys that are physically still held after a reconnect.
        for (const code of keyState) {
          pendingKeyEvents.set(code, { key: code, code, type: 'keydown', client_send_time: Date.now() });
        }
        for (const button of mouseButtonState) {
          pendingMouseButtons.set(button, {
            type: 'mousedown', button,
            x: mousePosition.x, y: mousePosition.y,
            client_send_time: Date.now(),
          });
        }
        flushPendingKeyEvents();
        flushPendingMouseEvents();
      };
      dataChannel.onbufferedamountlow = () => {
        flushPendingKeyEvents();
        flushPendingMouseEvents();
      };
      dataChannel.onmessage = (event) => {
        log(`Received Message on Data Channel "${dataChannel.label}": ${event.data}`);
      };
      dataChannel.onclose = () => {
        if (dataChannel) {
          log(`Data Channel Closed: "${dataChannel.label}"`);
        } else {
          log(`Data Channel Closed (channel object was null).`);
        }
      };
      mouseChannel.onopen = () => {
        log(`Mouse Channel Opened: "${mouseChannel.label}", ReadyState: ${mouseChannel.readyState}`);
        mouseChannel.bufferedAmountLowThreshold = 4096;
        flushPendingMouseEvents();
      };
      mouseChannel.onbufferedamountlow = flushPendingMouseEvents;
      mouseChannel.onclose = () => {
        if (mouseChannel) {
          log(`Mouse Channel Closed: "${mouseChannel.label}"`);
        } else {
          log(`Mouse Channel Closed (channel object was null).`);
        }
      };
      
    }

    async function handleAnswer(answerMsg) {
      if (!peerConnection || peerConnection.signalingState !== 'have-local-offer') {
        log("Received answer but PeerConnection is not ready or not expecting an answer.", 'warn');
        return;
      }
      const pc = peerConnection;
      log('Received SDP in answer.');
      if (!answerMsg.sdp || typeof answerMsg.sdp !== 'string' || !answerMsg.sdp.startsWith('v=')) {
        log('Invalid or missing SDP in answer.', 'error');
        return;
      }
      try {
        const remoteDesc = new RTCSessionDescription({ type: 'answer', sdp: answerMsg.sdp });
        await pc.setRemoteDescription(remoteDesc);
        if (peerConnection !== pc) return;
        reconnectAttempt = 0;
        log('Remote description (answer) set.');
        while (pendingRemoteIceCandidates.length > 0) {
          const candidate = pendingRemoteIceCandidates.shift();
          await pc.addIceCandidate(candidate);
        }
      } catch (err) {
        log('Error setting remote description: ' + err.message, 'error');
      }
    }

    async function handleRemoteIceCandidate(candidate) {
      if (!peerConnection) {
        pendingRemoteIceCandidates.push(new RTCIceCandidate(candidate));
        return;
      }
      const iceCandidate = new RTCIceCandidate(candidate);
      const pc = peerConnection;
      if (!pc.remoteDescription) {
        pendingRemoteIceCandidates.push(iceCandidate);
        return;
      }
      try {
        await pc.addIceCandidate(iceCandidate);
        if (peerConnection !== pc) return;
        log('Added remote ICE candidate.');
      } catch (err) {
        log('Error adding received ICE candidate: ' + err.message, 'error');
        console.error("Candidate causing error:", candidate);
      }
    }

    function sendKeyPress(keyData) {
      if (!keyData.code) return;
      if (!dataChannel || dataChannel.readyState !== 'open' ||
          dataChannel.bufferedAmount >= KEY_CHANNEL_HIGH_WATER || pendingKeyEvents.size > 0) {
        // Coalesce by physical key. The latest state is all that matters, and a
        // pending key-up can never be lost behind a flood of stale key-downs.
        pendingKeyEvents.set(keyData.code, keyData);
        flushPendingKeyEvents();
        return;
      }

      transmitKeyEvent(keyData);
    }

    function transmitKeyEvent(keyData) {
      if (!dataChannel || dataChannel.readyState !== 'open') return false;
      try {
        dataChannel.send(JSON.stringify({ ...keyData, sequenceId: ++keySequenceId }));
        return true;
      } catch (error) {
        pendingKeyEvents.set(keyData.code, keyData);
        return false;
      }
    }

    function flushPendingKeyEvents() {
      if (!dataChannel || dataChannel.readyState !== 'open') return;
      for (const [code, keyData] of pendingKeyEvents) {
        if (dataChannel.bufferedAmount >= KEY_CHANNEL_HIGH_WATER) break;
        pendingKeyEvents.delete(code);
        if (!transmitKeyEvent(keyData)) break;
      }
    }

    function releaseAllPressedKeys(reason) {
      const now = Date.now();
      for (const code of keyState) {
        sendKeyPress({ key: code, code, type: 'keyup', client_send_time: now, reason });
      }
      keyState.clear();
    }

    function sendMouseEvent(mouseData) {
      const isMove = mouseData.type === 'mousemove';
      const channel = isMove ? mouseChannel : dataChannel;
      const highWater = isMove ? MOUSE_CHANNEL_HIGH_WATER : KEY_CHANNEL_HIGH_WATER;
      const hasPending = isMove
        ? pendingMouseMove !== null
        : pendingMouseButtons.size > 0 || pendingMouseWheel !== null;
      if (!channel || channel.readyState !== 'open' ||
          channel.bufferedAmount >= highWater || hasPending) {
        if (isMove) pendingMouseMove = mouseData;
        else if (Number.isInteger(mouseData.button)) pendingMouseButtons.set(mouseData.button, mouseData);
        else if (mouseData.type === 'wheel') {
          if (pendingMouseWheel) {
            pendingMouseWheel.deltaX += mouseData.deltaX;
            pendingMouseWheel.deltaY += mouseData.deltaY;
            pendingMouseWheel.client_send_time = mouseData.client_send_time;
          } else {
            pendingMouseWheel = { ...mouseData };
          }
        }
        flushPendingMouseEvents();
        return;
      }

      transmitMouseEvent(mouseData);
    }

    function transmitMouseEvent(mouseData) {
      const channel = mouseData.type === 'mousemove' ? mouseChannel : dataChannel;
      if (!channel || channel.readyState !== 'open') return false;
      try {
        channel.send(JSON.stringify(mouseData));
        return true;
      } catch (_) {
        if (mouseData.type === 'mousemove') pendingMouseMove = mouseData;
        else if (Number.isInteger(mouseData.button)) pendingMouseButtons.set(mouseData.button, mouseData);
        else if (mouseData.type === 'wheel') pendingMouseWheel = { ...mouseData };
        return false;
      }
    }

    function flushPendingMouseEvents() {
      if (dataChannel && dataChannel.readyState === 'open') {
        for (const [button, mouseData] of pendingMouseButtons) {
          if (dataChannel.bufferedAmount >= KEY_CHANNEL_HIGH_WATER) return;
          pendingMouseButtons.delete(button);
          if (!transmitMouseEvent(mouseData)) return;
        }
        if (pendingMouseWheel && dataChannel.bufferedAmount < KEY_CHANNEL_HIGH_WATER) {
          const wheel = pendingMouseWheel;
          pendingMouseWheel = null;
          if (!transmitMouseEvent(wheel)) return;
        }
      }
      if (mouseChannel && mouseChannel.readyState === 'open' && pendingMouseMove &&
          mouseChannel.bufferedAmount < MOUSE_CHANNEL_HIGH_WATER) {
        const move = pendingMouseMove;
        pendingMouseMove = null;
        transmitMouseEvent(move);
      }
    }

    function releaseAllPressedMouseButtons(reason) {
      const now = Date.now();
      for (const button of mouseButtonState) {
        sendMouseEvent({
          type: 'mouseup', button,
          x: mousePosition.x, y: mousePosition.y,
          client_send_time: now, reason,
        });
      }
      mouseButtonState.clear();
    }

    function releaseAllPressedInput(reason) {
      releaseAllPressedKeys(reason);
      releaseAllPressedMouseButtons(reason);
    }

    function getRemotePointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return { ...mousePosition };
      return {
        x: Math.max(0, Math.min(canvas.width - 1,
          Math.round((event.clientX - rect.left) * canvas.width / rect.width))),
        y: Math.max(0, Math.min(canvas.height - 1,
          Math.round((event.clientY - rect.top) * canvas.height / rect.height))),
      };
    }

    function handleKeyDown(event) {
      if (!event.code || event.repeat) return;
      
      if (event.key === 'Escape' && (isFullscreen || document.fullscreenElement)) {
        if(document.fullscreenElement){
            document.exitFullscreen()
        }else{
            toggleFullscreen()
        }
        return
      }
      
      if (event.key === 'F12') {
        event.preventDefault();
        toggleDebug();
        return;
      }
      
      event.preventDefault();
      keyState.add(event.code);
      const keyData = { key: event.key, code: event.code, type: 'keydown', client_send_time: Date.now() };
      sendKeyPress(keyData);
    }

    function handleKeyUp(event) {
      if (!event.code) return;
      if (!keyState.has(event.code)) return;
      event.preventDefault();
      keyState.delete(event.code);
      const keyData = { key: event.key, code: event.code, type: 'keyup', client_send_time: Date.now() };
      sendKeyPress(keyData);
    }

    function handleMouseMove(event) {
      event.preventDefault();
      throttledSendMouseMove(event);
    }

    function handleMouseDown(event) {
      event.preventDefault();
      mouseButtonState.add(event.button);
      const position = getRemotePointerPosition(event);
      const mouseData = {
        type: 'mousedown',
        x: position.x,
        y: position.y,
        button: event.button,
        client_send_time: Date.now(),
      };
      mousePosition.x = position.x;
      mousePosition.y = position.y;
      sendMouseEvent(mouseData);
    }

    function handleMouseUp(event) {
      event.preventDefault();
      if (!mouseButtonState.has(event.button)) return;
      mouseButtonState.delete(event.button);
      const position = getRemotePointerPosition(event);
      const mouseData = {
        type: 'mouseup',
        x: position.x,
        y: position.y,
        button: event.button,
        client_send_time: Date.now(),
      };
      mousePosition.x = position.x;
      mousePosition.y = position.y;
      sendMouseEvent(mouseData);
    }

    function handleMouseWheel(event) {
      event.preventDefault();
      const position = getRemotePointerPosition(event);
      mousePosition.x = position.x;
      mousePosition.y = position.y;
      sendMouseEvent({
        type: 'wheel',
        x: position.x,
        y: position.y,
        deltaX: event.deltaX,
        deltaY: event.deltaY,
        client_send_time: Date.now(),
      });
    }

    function handleContextMenu(event) {
      event.preventDefault();
    }

    async function startConnection() {
      log("startConnection called.");
      if (!peerConnection) {
        createPeerConnection();
      } else {
        log("PeerConnection already exists.");
      }
      if (!peerConnection) return;
      const pc = peerConnection;
      const socket = ws;

      if (!pc.getTransceivers().some(t => t.receiver?.track?.kind === 'video')) {
        pc.addTransceiver('video', { direction: 'recvonly' });
        log("Added video transceiver.");
      } else {
        log("Video transceiver already exists.");
      }

      if (!pc.getTransceivers().some(t => t.receiver?.track?.kind === 'audio')) {
        pc.addTransceiver('audio', { direction: 'recvonly' });
        log("Added audio transceiver.");
      } else {
        log("Audio transceiver already exists.");
      }

      try {
        if (pc.signalingState === 'stable' || pc.signalingState === 'new') {
          log("Creating offer...");
          const offer = await pc.createOffer();
          if (peerConnection !== pc || ws !== socket) return;
          log("Setting local description (offer)...");
          await pc.setLocalDescription(offer);
          if (peerConnection !== pc || ws !== socket) return;

          if (socket && socket.readyState === WebSocket.OPEN) {
            log("Sending offer to signaling server...");
            socket.send(JSON.stringify({
              type: 'offer',
              sdp: offer.sdp
            }));
          } else {
            log("WebSocket not open, cannot send offer.", 'warn');
          }
        } else {
          log(`Not creating offer, signaling state is: ${pc.signalingState}`);
        }
      } catch (err) {
        log('Error creating/setting/sending offer: ' + err.message, 'error');
      }
    }

    if (hiddenVideoElement) {
      hiddenVideoElement.setAttribute('playsinline', 'true');
      if ('contentHint' in hiddenVideoElement) {
        hiddenVideoElement.contentHint = 'motion';
      }
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    window.addEventListener('blur', () => releaseAllPressedInput('window_blur'));
    window.addEventListener('pagehide', () => releaseAllPressedInput('page_hide'));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) releaseAllPressedInput('document_hidden');
    });

    const inputOverlay = document.getElementById('input-overlay');
    inputOverlay.addEventListener('mousemove', handleMouseMove);
    inputOverlay.addEventListener('mousedown', handleMouseDown);
    inputOverlay.addEventListener('wheel', handleMouseWheel, { passive: false });
    window.addEventListener('mouseup', handleMouseUp);
    inputOverlay.addEventListener('contextmenu', handleContextMenu);

    canvas.addEventListener('dragstart', (e) => e.preventDefault());

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && isFullscreen) {
            document.getElementById('fullscreenBtn').textContent = '⛶';
            isFullscreen = false;
            updateConnectionStatus('connected', 'Connected');
        }
    });

    showLoadingOverlay('Initializing', 'Starting CloudGaming client...');
  </script>
</body>
</html>
