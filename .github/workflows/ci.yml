name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-bookworm@sha256:1feed93082d872fa051fb6b5787a247d39e9c0d00357404c3a6554ba5e4a5315
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1" 
          --health-interval 5s 
          --health-timeout 3s 
          --health-retries 5
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json
      - name: Install dependencies (pinned)
        run: npm ci
      - name: Formatting check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Unit and security tests
        run: npm test
      - name: Auth integration test
        run: npm run test:integration

  

  staging-auth:
    name: Staging (auth + origin/subprotocol)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-bookworm@sha256:1feed93082d872fa051fb6b5787a247d39e9c0d00357404c3a6554ba5e4a5315
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1" 
          --health-interval 5s 
          --health-timeout 3s 
          --health-retries 5
    defaults:
      run:
        working-directory: Server
    env:
      ENABLE_AUTH: 'true'
      JWT_ALG: HS256
      JWT_SECRET: test-secret-that-is-at-least-32-bytes
      JWT_ISSUER: http://localhost
      JWT_AUDIENCE: test
      REQUIRE_WSS: 'false'
      ENABLE_SESSION_AUTH: 'false'
      PAIRING_TOKEN_SECRET: test-pairing-secret-at-least-32-bytes
      METRICS_SECRET: test-metrics-secret-at-least-32-bytes
      SUBPROTOCOL: cloud-gaming-v1
      ALLOWED_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Server/package-lock.json
      - name: Install dependencies (pinned)
        run: npm ci
      - name: Formatting check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Auth integration test
        run: npm run test:integration

